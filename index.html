.box{background:#fffcf2;border:1px solid rgba(60,50,20,.13);border-radius:16px;padding:32px 30px;width:100%;max-width:380px;box-shadow:0 2px 24px rgba(60,50,20,.06)}

button:hover{background:#0b7343}

var ITER=310000;
var el=function(i){return document.getElementById(i)};
function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
async function unlock(pw){
  var raw=b2u(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
  return new TextDecoder().decode(plain);
}
async function go(){
  var pw=el('gate-pw').value; if(!pw)return;
  var btn=el('gate-go'); btn.disabled=true; btn.textContent='Decrypting…'; el('gate-err').classList.remove('on');
  try{
    var html=await unlock(pw);
    try{sessionStorage.setItem('kitchino-key',pw)}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{sessionStorage.removeItem('kitchino-key')}catch(e2){}
    el('gate-err').classList.add('on'); btn.disabled=false; btn.textContent='Unlock';
    el('gate-pw').value=''; el('gate-pw').focus();
  }
}
el('gate-go').addEventListener('click',go);
el('gate-pw').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
(async function(){
  if(!window.crypto||!crypto.subtle){el('gate-err').textContent='This page must be opened over https:// — local file access is not supported.';el('gate-err').classList.add('on');return}
  var saved=null; try{saved=sessionStorage.getItem('kitchino-key')}catch(e){}
  if(saved){try{var h=await unlock(saved);document.open();document.write(h);document.close();}catch(e){try{sessionStorage.removeItem('kitchino-key')}catch(e2){}}}
})();
